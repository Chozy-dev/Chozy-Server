spring:
  application:
    name: chozy-server
  profiles:
    default: offline
    group:
      dev: offline
      prod: database
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: chozy
  sql:
    init:
      mode: never
  flyway:
    enabled: false
    locations: classpath:db/migration/chozy
    default-schema: chozy
    schemas: chozy
    create-schemas: true
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
springdoc:
  api-docs:
    version: openapi_3_1
    enabled: false
  default-produces-media-type: application/json
  override-with-generic-response: false
  swagger-ui:
    enabled: false
    persist-authorization: false
app:
  home:
    recommendations:
      enabled: ${APP_HOME_RECOMMENDATIONS_ENABLED:false}
      db-url: ${CHOZY_RECOMMENDATIONS_DB_URL:}
      db-username: ${CHOZY_RECOMMENDATIONS_DB_USERNAME:}
      db-password: ${CHOZY_RECOMMENDATIONS_DB_PASSWORD:}
  analysis:
    market:
      enabled: ${APP_ANALYSIS_MARKET_ENABLED:false}
      budget-db-url: ${CHOZY_MARKET_BUDGET_DB_URL:}
      budget-db-username: ${CHOZY_MARKET_BUDGET_DB_USERNAME:}
      budget-db-password: ${CHOZY_MARKET_BUDGET_DB_PASSWORD:}
      coupang-account: ${CHOZY_MARKET_COUPANG_ACCOUNT:}
      naver-account: ${CHOZY_MARKET_NAVER_ACCOUNT:}
      coupang-access-key: ${COUPANG_ACCESS_KEY:}
      coupang-secret-key: ${COUPANG_SECRET_KEY:}
      ad-key: ${NAVER_AD_API_KEY:}
      ad-secret: ${NAVER_AD_SECRET_KEY:}
      ad-customer-id: ${NAVER_AD_CUSTOMER_ID:}
      hub-id: ${NAVER_HUB_KEY_ID:}
      hub-key: ${NAVER_HUB_KEY:}
  usage:
    free-monthly-report-limit: ${FREE_MONTHLY_REPORT_LIMIT:3}
  security:
    docs-public: false
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
logging:
  level:
    root: INFO
    com.chozy.server: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF
