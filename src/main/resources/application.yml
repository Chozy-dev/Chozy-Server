spring:
  application:
    name: chozy-server
  profiles:
    default: offline
    group:
      dev: offline
      prod: database
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: chozy
  sql:
    init:
      mode: never
  flyway:
    enabled: false
    locations: classpath:db/migration/chozy
    default-schema: chozy
    schemas: chozy
    create-schemas: true
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  security:
    docs-public: false
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
logging:
  level:
    root: INFO
    com.chozy.server: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF
