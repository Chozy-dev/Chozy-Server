spring:
  datasource:
    url: ${CHOZY_DEV_DB_URL:jdbc:postgresql://127.0.0.1:55432/chozy_spring_dev}
    username: ${CHOZY_DEV_DB_USERNAME:chozy_spring_dev}
    password: ${CHOZY_DEV_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  auth:
    unverified-signup-enabled: true
  security:
    docs-public: true
